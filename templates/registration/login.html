{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="padding-top:80px;background:var(--gradient-hero)">
  <div class="hero-bg-orb orb-1" style="opacity:0.5"></div>
  <div style="width:100%;max-width:440px;padding:0 16px;" data-aos="fade-up">
    <div class="nordic-card p-5">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-2" style="font-size:2.5rem;width:fit-content">
          <i class="bi bi-hexagon-fill text-primary"></i>
        </div>
        <h4 class="fw-bold mb-1">Welcome Back</h4>
        <p class="text-muted small">Sign in to access all opportunities</p>
      </div>
      <form method="POST" id="login-form">
        {% csrf_token %}
        {% if form.errors %}
        <div class="alert alert-danger rounded-3 mb-3" style="background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.3);color:#FF6B35">
          <i class="bi bi-exclamation-triangle me-2"></i>Invalid username or password.
        </div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label text-muted small fw-semibold text-uppercase" style="letter-spacing:.05em">Username</label>
          <input type="text" name="username" class="form-control" style="background:var(--bg-base);border:1px solid var(--border-color);color:var(--text-primary);border-radius:10px;padding:12px 16px" placeholder="Enter your username" autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label text-muted small fw-semibold text-uppercase" style="letter-spacing:.05em">Password</label>
          <input type="password" name="password" class="form-control" style="background:var(--bg-base);border:1px solid var(--border-color);color:var(--text-primary);border-radius:10px;padding:12px 16px" placeholder="Enter your password">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-nordic w-100"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
      </form>
      <div class="text-center mt-4">
        <a href="{% url 'core:home' %}" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Portal</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
